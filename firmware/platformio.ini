; RNV1 (Robotic Neural Vector 1) - PlatformIO Firmware Configuration
; Target Hardware: Seeed Studio XIAO ESP32S3 Sense (ESP32-S3R8, 8MB Octal PSRAM, 8MB Flash)
[env:xiao_esp32s3_sense]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB

build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DRNV1_CONTROL_HZ=50
    -DRNV1_ENABLE_SIMD=1

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    pololu/VL53L0X@^1.3.1
    electroniccats/MPU6050@^1.3.1
